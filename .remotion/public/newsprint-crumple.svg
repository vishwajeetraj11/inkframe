<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.86"
        numOctaves="4"
        seed="19"
        stitchTiles="stitch"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="matrix"
        values="0 0 0 0 0.22 0 0 0 0 0.18 0 0 0 0 0.12 0 0 0 1 0"
        result="tint"
      />
      <feComponentTransfer in="tint">
        <feFuncA type="table" tableValues="0 0.1" />
      </feComponentTransfer>
    </filter>

    <filter id="paperCloud" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.045"
        numOctaves="2"
        seed="11"
        stitchTiles="stitch"
        result="cloud"
      />
      <feColorMatrix
        in="cloud"
        type="matrix"
        values="0 0 0 0 0.32 0 0 0 0 0.24 0 0 0 0 0.15 0 0 0 0.22 0"
      />
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
  </defs>

  <rect width="100%" height="100%" filter="url(#paperCloud)" opacity="0.45" />

  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>
