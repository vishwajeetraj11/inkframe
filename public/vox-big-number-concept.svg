<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f0e4"/>
      <stop offset="55%" stop-color="#eadfc9"/>
      <stop offset="100%" stop-color="#d6c09e"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7f6440" opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#dots)"/>
  <rect x="110" y="120" width="980" height="590" rx="0" fill="#f7f1e7" stroke="#3d2f1c" stroke-opacity="0.16" filter="url(#shadow)"/>
  <rect x="110" y="120" width="18" height="590" fill="#d6a117"/>
  <text x="170" y="205" fill="#334155" font-size="28" font-family="Courier New, monospace" letter-spacing="7">BY THE NUMBERS</text>
  <text x="170" y="330" fill="#111827" font-size="210" font-family="Arial, sans-serif" font-weight="900">22%</text>
  <rect x="170" y="352" width="365" height="24" fill="#d6a117" opacity="0.45"/>
  <text x="170" y="455" fill="#111827" font-size="58" font-family="Arial, sans-serif" font-weight="800">Median rent since 2019</text>
  <text x="170" y="528" fill="#374151" font-size="34" font-family="Arial, sans-serif">A single statistic drives the frame. Supporting context stays compact.</text>
  <text x="170" y="575" fill="#374151" font-size="34" font-family="Arial, sans-serif">Use this for price shocks, vote gaps, emissions, costs, or health trends.</text>
  <rect x="760" y="560" width="260" height="60" rx="30" fill="#e8c96a" fill-opacity="0.45"/>
  <text x="805" y="600" fill="#111827" font-size="30" font-family="Arial, sans-serif" font-weight="700">1 number, 1 takeaway</text>
  <text x="120" y="820" fill="#334155" font-size="26" font-family="Arial, sans-serif" font-weight="700">Concept: Big Number Card</text>
</svg>
