<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43556c"/>
      <stop offset="45%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="#0f172a"/>
  <rect x="90" y="90" width="1220" height="720" fill="url(#photo)"/>
  <circle cx="390" cy="370" r="165" fill="#9ca3af" opacity="0.22"/>
  <circle cx="940" cy="315" r="185" fill="#cbd5e1" opacity="0.2"/>
  <circle cx="820" cy="575" r="210" fill="#94a3b8" opacity="0.14"/>
  <rect x="140" y="118" width="500" height="214" fill="#f7f1e7" stroke="#3d2f1c" stroke-opacity="0.16" filter="url(#shadow)"/>
  <rect x="140" y="118" width="16" height="214" fill="#d6a117"/>
  <text x="188" y="170" fill="#334155" font-size="24" font-family="Courier New, monospace" letter-spacing="6">EXPLAINED</text>
  <text x="188" y="235" fill="#111827" font-size="56" font-family="Arial, sans-serif" font-weight="900">Annotated Image Card</text>
  <text x="188" y="286" fill="#374151" font-size="28" font-family="Arial, sans-serif">Use a still image, map, or diagram as the base, then pin callouts</text>
  <text x="188" y="322" fill="#374151" font-size="28" font-family="Arial, sans-serif">to the exact details the narration is explaining.</text>
  <circle cx="908" cy="315" r="13" fill="#d6a117"/>
  <circle cx="391" cy="370" r="13" fill="#d6a117"/>
  <circle cx="820" cy="575" r="13" fill="#d6a117"/>
  <path d="M391 370 L255 470" stroke="#f8fafc" stroke-width="4"/>
  <path d="M908 315 L1145 230" stroke="#f8fafc" stroke-width="4"/>
  <path d="M820 575 L1090 650" stroke="#f8fafc" stroke-width="4"/>
  <rect x="165" y="440" width="290" height="86" fill="#f8f4ec"/>
  <text x="190" y="476" fill="#111827" font-size="26" font-family="Arial, sans-serif" font-weight="700">Label this zone</text>
  <text x="190" y="510" fill="#374151" font-size="22" font-family="Arial, sans-serif">Short note tied to a visual point.</text>
  <rect x="1110" y="185" width="200" height="86" fill="#f8f4ec"/>
  <text x="1132" y="221" fill="#111827" font-size="26" font-family="Arial, sans-serif" font-weight="700">Key detail</text>
  <text x="1132" y="255" fill="#374151" font-size="22" font-family="Arial, sans-serif">Direct annotation.</text>
  <rect x="1058" y="610" width="235" height="86" fill="#f8f4ec"/>
  <text x="1082" y="646" fill="#111827" font-size="26" font-family="Arial, sans-serif" font-weight="700">Another callout</text>
  <text x="1082" y="680" fill="#374151" font-size="22" font-family="Arial, sans-serif">Keep it concise.</text>
  <text x="120" y="845" fill="#e5e7eb" font-size="26" font-family="Arial, sans-serif" font-weight="700">Concept: Annotated Image Card</text>
</svg>
