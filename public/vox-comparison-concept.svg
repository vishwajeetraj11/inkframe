<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f0e4"/>
      <stop offset="100%" stop-color="#dac6a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="130" y="120" width="1140" height="620" fill="#f8f3ea" stroke="#3d2f1c" stroke-opacity="0.16" filter="url(#shadow)"/>
  <rect x="130" y="120" width="18" height="620" fill="#d6a117"/>
  <text x="190" y="190" fill="#334155" font-size="28" font-family="Courier New, monospace" letter-spacing="7">VS</text>
  <text x="190" y="262" fill="#111827" font-size="62" font-family="Arial, sans-serif" font-weight="900">Comparison Card</text>
  <rect x="190" y="315" width="420" height="330" fill="#e8eef5"/>
  <rect x="670" y="315" width="420" height="330" fill="#f3e6de"/>
  <line x1="640" y1="300" x2="640" y2="660" stroke="#111827" stroke-opacity="0.16" stroke-width="2"/>
  <text x="245" y="372" fill="#111827" font-size="34" font-family="Arial, sans-serif" font-weight="800">Option A</text>
  <text x="245" y="425" fill="#334155" font-size="28" font-family="Arial, sans-serif">Cheaper upfront</text>
  <text x="245" y="470" fill="#334155" font-size="28" font-family="Arial, sans-serif">Faster to adopt</text>
  <text x="245" y="515" fill="#334155" font-size="28" font-family="Arial, sans-serif">Higher long-term cost</text>
  <text x="245" y="610" fill="#111827" font-size="74" font-family="Arial, sans-serif" font-weight="900">$4.2B</text>
  <text x="725" y="372" fill="#111827" font-size="34" font-family="Arial, sans-serif" font-weight="800">Option B</text>
  <text x="725" y="425" fill="#334155" font-size="28" font-family="Arial, sans-serif">More durable</text>
  <text x="725" y="470" fill="#334155" font-size="28" font-family="Arial, sans-serif">Slower rollout</text>
  <text x="725" y="515" fill="#334155" font-size="28" font-family="Arial, sans-serif">Lower lifetime cost</text>
  <text x="725" y="610" fill="#111827" font-size="74" font-family="Arial, sans-serif" font-weight="900">$3.1B</text>
  <rect x="1110" y="315" width="110" height="330" fill="#111827"/>
  <text x="1165" y="495" fill="#f8fafc" font-size="42" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">VS</text>
  <text x="130" y="820" fill="#334155" font-size="26" font-family="Arial, sans-serif" font-weight="700">Concept: Comparison Card</text>
</svg>
